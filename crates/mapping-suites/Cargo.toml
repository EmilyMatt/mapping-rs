[package]
name = "mapping-suites"
version.workspace = true
authors.workspace = true
description = "A collection of SLAM suites, based on mapping-algorithms"
edition.workspace = true
license.workspace = true
categories = ["algorithms", "science", "science::robotics"]
keywords = ["algorithms", "mathematics", "science"]
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]

[features]
default = ["std"]
std = ["mapping-algorithms/std", "nalgebra/std", "num-traits/std", "thiserror", "tracing?/std"]

tracing = ["dep:tracing", "mapping-algorithms/tracing"]

[dependencies]
nalgebra = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

mapping-algorithms = { workspace = true }
