name: PR Title Check and Add Label

on:
  pull_request:
    types: [ opened, edited, synchronize ]

permissions:
  pull-requests: write

jobs:
  update-labels:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Passed through the environment rather than interpolated into the script,
      # so that a crafted PR title cannot inject shell commands
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check PR title format
        run: |
          echo "PR Title: ${PR_TITLE}"

          # Check if the PR title matches the required format
          if [[ ! "${PR_TITLE}" =~ ^(chore|ci|feat|fix):\ [A-Z].* ]]; then
            echo "PR title is invalid. It should start with 'chore:', 'ci:', 'feat:', or 'fix:' followed by a description starting with a capital letter"
            exit 1
          fi

      - name: Get existing labels
        run: |
          # Fetch current labels on the PR as a JSON array
          labels=$(curl -f -s \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/labels?per_page=100" \
          | jq -c '[.[].name]')

          echo "Existing Labels: ${labels}"
          echo "labels=${labels}" >> "${GITHUB_ENV}"

      - name: Add label based on PR title
        run: |
          # Determine the label based on the prefix in the PR title
          case "${PR_TITLE}" in
            chore:*) new_label="Chore" ;;
            feat:*)  new_label="Feature" ;;
            fix:*)   new_label="Fix" ;;
            ci:*)    new_label="Github Actions" ;;
            *)       new_label="" ;;
          esac

          echo "Adding label: ${new_label}"

          # Merge through jq so the value stays a valid JSON array
          labels=$(jq -cn --argjson labels "${labels}" --arg new "${new_label}" \
            '$labels + (if $new == "" then [] else [$new] end) | unique')

          echo "Labels: ${labels}"
          echo "labels=${labels}" >> "${GITHUB_ENV}"

      - name: Get modified files in the PR
        run: |
          # Get list of modified files as a JSON array
          modified_files=$(curl -f -s \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
          | jq -c '[.[].filename]')

          echo "Modified Files: ${modified_files}"
          echo "modified_files=${modified_files}" >> "${GITHUB_ENV}"

      - name: Add file-based labels
        run: |
          # Each pattern is matched against the filenames individually, rather
          # than against the whole JSON array as one line
          # TODO: Ensure the Dependencies label only if [dependencies] sections is changed
          new_labels=$(jq -cn --argjson files "${modified_files}" '
            [
              (if $files | any(endswith(".rs"))                  then "Rust"           else empty end),
              (if $files | any(startswith(".github/workflows/")) then "Github Actions" else empty end),
              (if $files | any(test("(^|/)Cargo\\.toml$"))       then "Dependencies"   else empty end)
            ]')

          echo "File-based labels: ${new_labels}"

          labels=$(jq -cn --argjson labels "${labels}" --argjson new "${new_labels}" \
            '$labels + $new | unique')

          echo "Labels: ${labels}"
          echo "labels=${labels}" >> "${GITHUB_ENV}"

      - name: Update PR labels
        run: |
          echo "Final labels: ${labels}"

          if [[ "$(jq -r 'length' <<< "${labels}")" -eq 0 ]]; then
            echo "No labels to apply, skipping..."
            exit 0
          fi

          curl -f -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "$(jq -cn --argjson labels "${labels}" '{labels: $labels}')" \
              "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/labels"
